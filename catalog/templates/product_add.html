{% extends "base.html" %}
{% load my_tags %}

{% block content %}
{% include 'header.html' %}
<div class="pricing-header px-2 py-3 pt-md-0 pb-md-4 mx-auto text-center">
    <p>Заполните карточку вашего товара</p>
</div>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    <div class="container">
        <div class="card mb-3 border-info">
            <div class="mb-3 mx-5 mt-3">
                <label class="form-label">Название</label>
                    {{ form.name }}
            </div>

            <div class="mb-3 mx-5">
                <label class="form-label">Описание</label>
                    {{ form.description }}
            </div>

            <div class="mb-3 mx-5">
                <label class="form-label">Изображение</label>
                    {{ form.image }}
            </div>

            <div class="mb-3 mx-5">
               <label class="form-label">Категория</label>
                    {{ form.category }}

            </div>

            <div class="mb-3 mx-5">
                <label class="form-label">Цена</label>
                    {{ form.price }}
            </div>

            <div class="mx-5 mb-3">
                <button type="submit"
                        class="btn btn-outline-primary">
                    Сохранить товар
                </button>
            </div>

        </div>
    </div>
</form>

{% endblock %}
