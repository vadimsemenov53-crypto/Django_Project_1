{% extends "blogs/base_blog.html" %}
{% load blog_tags %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">

            {% for post in object_list %}

            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ post.image|media_filter }}">
                    <div class="card-body">
                        <p class="card-text">{{ post.title }}</p>
                        <p class="card-text">{{ post.content | truncatechars:100 }}</p>
                        <p class="card-text">Количество просмотров: {{ post.views_count }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="btn-group">
                                <a class="btn btn-primary" href="{% url 'blogs:blog_detail' post.pk %}" role="button">
                                    Посмотреть
                                </a>
                                <a class="btn btn-secondary" href="{% url 'blogs:blog_update' post.pk %}" role="button">
                                    Редактировать
                                </a>
                                <a class="btn btn-danger" href="#" role="button">Удалить</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            {% endfor %}

        </div>
    </div>
</div>

{% endblock %}
